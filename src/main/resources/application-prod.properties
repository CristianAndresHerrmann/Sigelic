# =======================================================================
# SIGELIC - Perfil productivo (despliegue en OCI)
# Activar con SPRING_PROFILES_ACTIVE=prod
#
# Este perfil se superpone a application.properties. Hereda de ahi
# server.port=${SERVER_PORT:8080} y el resto de la configuracion base.
# =======================================================================

# =======================================================================
# SERVIDOR
# =======================================================================

# Caddy termina el TLS: sin esto los redirects de login salen en http://
# y el HSTS que configura SecurityConfig los bloquea.
server.forward-headers-strategy=native
server.servlet.session.timeout=${SESSION_TIMEOUT:60m}

# =======================================================================
# BASE DE DATOS
# =======================================================================

# URL completa por entorno: la de application.properties lleva useSSL=false
# hardcodeado y MySQL HeatWave exige TLS (sslMode=REQUIRED).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=10000

# =======================================================================
# JPA / FLYWAY
# =======================================================================

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Nunca habilitar flyway:clean contra la base productiva
spring.flyway.clean-disabled=true

# =======================================================================
# LOGGING
# =======================================================================

logging.level.root=INFO
logging.level.com.example.sigelic=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.example.sigelic.service.CustomUserDetailsService=WARN

# =======================================================================
# VAADIN
# =======================================================================

vaadin.launch-browser=false

# =======================================================================
# ACTUATOR
# =======================================================================

# Solo health queda expuesto; metrics e info siguen requiriendo autenticacion.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# =======================================================================
# SEMILLAS DE USUARIOS PRIVILEGIADOS
# =======================================================================

# Sin valor por defecto a proposito: si faltan, la aplicacion no arranca.
# Es preferible a publicar con una contrasena conocida.
sigelic.seed.admin-password=${SIGELIC_ADMIN_PASSWORD}
sigelic.seed.superadmin-password=${SIGELIC_SUPERADMIN_PASSWORD}
